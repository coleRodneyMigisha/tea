[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "tea"
version = "0.1.0"
description = "Local desktop app that drafts weekly and on-demand blog posts for Medium."
requires-python = ">=3.12"
readme = "README.md"
dependencies = [
  "PySide6>=6.7",
  "pydantic>=2.7",
  "markdown-it-py>=3.0",
  "platformdirs>=4.2",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-qt>=4.4", "pytest-cov", "ruff", "mypy"]

[project.scripts]
tea = "tea.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/tea"]

# data/ and prompts/ live at the repo root; installed copies carry them inside the package.
[tool.hatch.build.targets.wheel.force-include]
"data" = "tea/data"
"prompts" = "tea/prompts"

[tool.ruff]
line-length = 100
target-version = "py312"
# Python files only: newer ruff also formats code blocks in Markdown, which would rewrite docs/.
include = ["*.py", "*.pyi"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "ASYNC"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.mypy]
python_version = "3.12"
strict = false
